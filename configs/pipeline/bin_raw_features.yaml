# Pipeline shape for tools with no model: features -> pass-through embedder -> binner.
# The binner must ask for `z: raw_features` (there is no filter stage here, so
# a binner that needs `z_kept` fails the contract check at start).
name: ???
target: bins
interventions: []

stages:
  features:
    _target_: megobin.stages.features.PrecomputedFeatures
    _recursive_: false
    config: ${oc.select:features,null}
  embedder:
    _target_: megobin.stages.embedder.PassThroughEmbedder
    labels: [raw_features]
  binner:
    _target_: megobin.stages.binner.BinnerStage
    _recursive_: false
    config: ${binner}
