# @package _global_
#
# UncertainGen encoder (two-phase) with hybrid negatives: half drawn
# from taxonomy cannot-link pairs, half from uniform multinomial —
# primary configuration. See CLAUDE-codebase.md § "Encoder
# Specifications → UncertainGen".
#
# Hyperparameters:
#   - Two-phase Adam lr=1e-3 both phases (configs/trainer/two_phase.yaml)
#   - Phase 1: 50 epochs mean-only; Phase 2: 25 epochs cov-only
#   - Batch 10 000 both phases
#   - neg_per_pos=1000, taxonomy_fraction=0.5 (configs/pair_sampler/hybrid.yaml)
#   - Input dim 236 = 136 canonical k-mer + 2 × 50 BAMs

defaults:
  - _self_
  - /dataset: CAMI_medium
  - /features: canonical_kmer_abundance
  - /representation: uncertain_gen
  - /loss: mahalanobis_bce
  - /binner: infomap
  - /evaluator: checkm2
  - /pair_sampler: hybrid
  - /trainer: two_phase
  - /logger: tensorboard

seed: 42
use_abundance: true

representation:
  input_dim: 236
  embedding_dim: 256
