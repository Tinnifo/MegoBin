# @package _global_

defaults:
  - /dataset: example
  - /features: canonical_kmer_abundance
  - /encoder: semibin2
  - /loss: hinge
  - /binner: dbscan_ensemble_semibin
  - /evaluator: checkm2
  - /filter: no_op
  - /pair_sampler: semibin2
  - /trainer: single_phase
  - /logger: tensorboard
  - _self_

seed: 42

trainer:
  epochs: 15          # SemiBin2 self-supervised long-read default

encoder:
  input_dim: 136
  kmer_dim: 136
  output_dim: 100
  is_combined: false
