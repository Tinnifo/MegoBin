# @package _global_
#
# UncertainGen encoder (two-phase) with random-only negative pairs.
# Strongest ablation for isolating the cov-head's contribution — no
# taxonomy signal, positives are contig halves only.
# See CLAUDE-codebase.md § "Encoder Specifications → UncertainGen".
#
# Hyperparameters:
#   - Two-phase Adam lr=1e-3 both phases (configs/trainer/two_phase.yaml)
#   - Phase 1: 50 epochs mean-only; Phase 2: 25 epochs cov-only
#   - Batch 10 000 both phases
#   - neg_per_pos=1000 (configs/pair_sampler/uncertain_gen.yaml —
#     matches UncertainGen paper's random-multinomial setting)
#   - Input dim 236 = 136 canonical k-mer + 2 × 50 BAMs

defaults:
  - _self_
  - /dataset: CAMI_medium
  - /features: canonical_kmer_abundance
  - /representation: uncertain_gen
  - /loss: mahalanobis_bce
  - /binner: kmedoids
  - /evaluator: checkm2
  - /pair_sampler: uncertain_gen
  - /trainer: two_phase
  - /logger: tensorboard

seed: 42
use_abundance: true

representation:
  input_dim: 236
  embedding_dim: 256
