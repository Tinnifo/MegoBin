# @package _global_
#
# UncertainGen encoder × CAMI Toy. Fully-pinned reproducible run.
# Source: CLAUDE-codebase.md § "Encoder Specifications → UncertainGen".
# Run: python src/pipeline.py --config-name experiment/training/uncertain_gen_cami_toy

defaults:
  - _self_
  - /dataset: CAMI_toy
  - /features: canonical_kmer_abundance
  - /representation: uncertain_gen
  - /loss: mahalanobis_bce
  - /binner: kmedoids
  - /evaluator: checkm2
  - /pair_sampler: hybrid
  - /trainer: two_phase
  - /logger: tensorboard

seed: 42
use_abundance: true

# UncertainGen two-phase defaults (50 + 25 epochs, lr 1e-3, batch 10 000)
# live in configs/trainer/two_phase.yaml. Override here if needed.

representation:
  input_dim: 236           # 136 canonical k-mer + 2 × 50 BAMs (CAMI_toy num_bams)
  embedding_dim: 256
  dropout: 0.2
