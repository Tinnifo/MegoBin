# @package _global_
#
# SemiBin encoder × CAMI Toy. Fully-pinned reproducible run.
# Source: CLAUDE-codebase.md § "Encoder Specifications → SemiBin Encoder".
# Run: python src/pipeline.py --config-name experiment/training/semibin_cami_toy

defaults:
  - _self_
  - /dataset: CAMI_toy
  - /features: canonical_kmer_abundance
  - /representation: semibin_encoder
  - /loss: hinge
  - /binner: infomap
  - /evaluator: checkm2
  - /pair_sampler: semibin
  - /trainer: single_phase
  - /logger: tensorboard

seed: 42
use_abundance: true

trainer:
  epochs: 15               # SemiBin spec: 15 epochs self-supervised
  batch_size: 2048         # SemiBin spec
  optimizer:
    lr: 1e-3               # SemiBin spec
  scheduler:
    _target_: torch.optim.lr_scheduler.StepLR
    _partial_: true
    step_size: 1
    gamma: 0.9             # SemiBin spec

representation:
  input_dim: 236           # 136 canonical k-mer + 2 × 50 BAMs
  embedding_dim: 100       # SemiBin spec: fixed 100-dim output
  dropout: 0.2
