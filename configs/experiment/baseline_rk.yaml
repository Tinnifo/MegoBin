# @package _global_
#
# Poisson co-occurrence baseline — RevisitingKmers (Celikkanat et al.).
# See CLAUDE-codebase.md § "Encoder Specifications → Poisson".
#
# Hyperparameters:
#   - Embedding table init:      Uniform(-1, 1) (encoder default)
#   - Full (non-canonical) 4-mer features, dims=256 (features/full_kmer.yaml)
#   - Window w=4, 10K sampled reads (compute_cooccurrence default)
#   - No pseudocount (features/full_kmer.yaml)
#   - Epochs 50, batch 4096  (project default — RK paper does not specify;
#     calibrated against 65K-cell upper triangle for 256 k-mers)
#   - Optimizer Adam lr=1e-3 (configs/optimizer/adam.yaml)

defaults:
  - _self_
  - /dataset: CAMI_medium
  - /representation: poisson
  - /loss: poisson_nll
  - /binner: kmedoids
  - /features: full_kmer
  - /evaluator: checkm2
  - /pair_sampler: cooccurrence
  - /trainer: single_phase
  - /logger: tensorboard

seed: 42

trainer:
  epochs: 50
  batch_size: 4096
