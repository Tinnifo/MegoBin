[build-system]
requires = ["setuptools>=68.0", "setuptools-scm>=8.0"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "megobin"
version = "0.1.0"
description = "Modular research pipeline for metagenomic binning"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "pandas>=2.0",
    "scikit-learn>=1.2",
    "torch>=2.0",
    "hydra-core>=1.3",
    "omegaconf>=2.3",
    "wandb>=0.15",
    "dvc>=3.0",
    "igraph>=0.11",
    "leidenalg",
    "infomap",
    "snakemake>=8.0",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "black",
    "ruff",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
