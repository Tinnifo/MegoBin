[build-system]
requires = ["setuptools>=68.0", "setuptools-scm>=8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "megobin"
version = "0.1.0"
description = "Modular research pipeline for metagenomic binning"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "pandas>=2.0",
    "scikit-learn>=1.2",
    "torch>=2.0",
    "hydra-core>=1.3",
    "omegaconf>=2.3",
    "tensorboard>=2.14",
    "tabulate>=0.9",
    "pyyaml>=6.0",
    "dvc>=3.0",
    "snakemake>=8.0",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "black",
    "ruff",
    "mypy>=1.11",
    "types-PyYAML",
]
# The genuine SemiBin2 reference oracle for the real-data binner fidelity check
# (tests/fidelity/test_real_data.py, real_data-gated). The default
# harness-validation suite does not need it (that test self-skips when SemiBin
# is absent).
fidelity = [
    "SemiBin>=2.3",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["megobin*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The default suite is laptop-friendly: CPU-only, minutes, no external tools or
# data. Opt into the gated tests with `pytest -m real_data` or `-m slow`
# (or `-m ""` to run everything).
addopts = "-m 'not slow and not real_data'"
markers = [
    "slow: minutes+ runtime; excluded from the default suite",
    "real_data: needs external genomes/BAMs/SemiBin bin_long/CheckM2; excluded by default",
]
filterwarnings = [
    "ignore:Precomputed sparse input was not sorted by row values",
]

[tool.mypy]
files = ["megobin"]
python_version = "3.10"
ignore_missing_imports = true
follow_imports = "silent"
warn_unused_ignores = true
warn_redundant_casts = true
# Legacy utility / data-generation modules — out of scope for Protocol enforcement.
# Exclude until they earn their own type-cleanup pass.
exclude = [
    "megobin/features/",
    "megobin/utils/atomicwrite\\.py",
    "megobin/utils/fasta\\.py",
    "megobin/utils/UG\\.utils\\.py",
]
